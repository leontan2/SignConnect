server:
  port: 8082

spring:
  application:
    name: realtime-service
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
    mapper:
      allow-coercion-of-scalars: false

signconnect:
  rooms:
    ticket-secret: ${SIGNCONNECT_REALTIME_TICKET_SECRET:signconnect-local-realtime-ticket-secret-2026}
    max-participants: ${SIGNCONNECT_ROOM_MAX_PARTICIPANTS:8}
    require-join: ${SIGNCONNECT_ROOM_REQUIRE_JOIN:true}
    resume-ticket-ttl: ${SIGNCONNECT_ROOM_RESUME_TICKET_TTL:5m}
  recognition:
    inference-url: ${SIGN_INFERENCE_URL:http://localhost:8083}
    inference-timeout: ${SIGN_INFERENCE_TIMEOUT:500ms}
    window-frames: ${SIGN_RECOGNITION_WINDOW_FRAMES:30}
    stride-frames: ${SIGN_RECOGNITION_STRIDE_FRAMES:5}
    confidence-threshold: ${SIGN_RECOGNITION_CONFIDENCE_THRESHOLD:0.80}
    stable-active-evaluations: ${SIGN_RECOGNITION_STABLE_ACTIVE_EVALUATIONS:3}
    idle-evaluations: ${SIGN_RECOGNITION_IDLE_EVALUATIONS:2}
    duplicate-cooldown: ${SIGN_RECOGNITION_DUPLICATE_COOLDOWN:1500ms}
    unknown-rate-limit: ${SIGN_RECOGNITION_UNKNOWN_RATE_LIMIT:2s}
    tracking-timeout: ${SIGN_RECOGNITION_TRACKING_TIMEOUT:2s}
    # Bounded v1 5x224 JSON chunks require at least 32KB of logical message capacity.
    max-message-size: ${SIGN_RECOGNITION_MAX_MESSAGE_SIZE:64KB}
    simulator-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
