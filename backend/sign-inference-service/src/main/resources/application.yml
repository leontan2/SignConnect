server:
  port: 8083

spring:
  application:
    name: sign-inference-service
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
    mapper:
      allow-coercion-of-scalars: false

signconnect:
  inference:
    limits:
      max-request-body-bytes: ${SIGN_MAX_REQUEST_BODY_BYTES:262144}
      max-concurrent-predictions: ${SIGN_MAX_CONCURRENT_PREDICTIONS:4}
      concurrency-acquire-timeout-ms: ${SIGN_CONCURRENCY_ACQUIRE_TIMEOUT_MS:250}
    model:
      resource: ${SIGN_MODEL_RESOURCE:}
      labels-resource: ${SIGN_MODEL_LABELS_RESOURCE:}
      input-name: ${SIGN_MODEL_INPUT_NAME:features}
      output-name: ${SIGN_MODEL_OUTPUT_NAME:probabilities}
      expected-version: ${SIGN_MODEL_EXPECTED_VERSION:}
      allow-mock-model: false

logging:
  level:
    # These framework loggers stringify MVC values and binding failures at DEBUG/TRACE.
    org.springframework.web.method.HandlerMethod: INFO
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,modelReadiness
