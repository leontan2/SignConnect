[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "signconnect-sign-recognition"
version = "0.1.0"
description = "Reproducible landmark-sequence model pipeline for SignConnect"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24,<3",
  "jsonschema>=4.23,<5",
  "torch>=2.4,<3",
  "tomli>=2.0,<3; python_version < '3.11'",
]

[project.optional-dependencies]
export = [
  "onnx>=1.16,<2",
  "onnxruntime>=1.19,<1.24",
  "onnxscript>=0.5,<1",
]
test = [
  "pytest>=8.3,<9",
  "onnx>=1.16,<2",
  "onnxruntime>=1.19,<1.24",
  "onnxscript>=0.5,<1",
]

[project.scripts]
signconnect-ml = "signconnect_ml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/signconnect_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
